<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <meta content="#b91c1c" name="theme-color" />
  <title>Teh Dandang - Portal Dashboard</title>
  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet" />
  <style>
    body {
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .portal-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      padding: 40px;
      max-width: 520px;
      width: 100%;
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #E31E24;
      margin-bottom: 8px;
    }

    .brand-sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .btn-red-gradient {
      background: linear-gradient(135deg, #E31E24 0%, #C91820 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      font-weight: 600;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(227, 30, 36, 0.28);
      transition: all 0.2s;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-bottom: 12px;
    }

    .btn-red-gradient:hover {
      background: linear-gradient(135deg, #C91820 0%, #A9141B 100%);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(201, 24, 32, 0.35);
    }

    .btn-red-outline {
      background: #ffffff;
      color: #E31E24;
      border: 1px solid #e2e8f0;
      padding: 12px 20px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .btn-red-outline:hover {
      background: #f8fafc;
      color: #C91820;
      border-color: #E31E24;
    }
  </style>
</head>

<body>
  <div class="portal-card text-center">
    <img src="assets/img/Teh Dandang.jpeg" alt="Teh Dandang"
      style="width: 72px; height: 72px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(185, 28, 28, 0.25);" />
    <h1 class="brand-title">TEH DANDANG</h1>
    <p class="brand-sub">Sistem Monitoring &amp; Executive Analytics</p>
    <a class="btn-red-gradient" href="dashboard%20ADMIN%20PUSAT/index.html">
      Dashboard OWNER
    </a>
    <!-- <a class="btn-red-outline" href="dashboard%20OWNER/index.html">
    Buka Dashboard OWNER
   </a> -->
  </div>
</body>

</html>
